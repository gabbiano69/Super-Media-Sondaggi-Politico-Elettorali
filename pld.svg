<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="pldBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eff6ff" />
    </radialGradient>
    <linearGradient id="pldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="pldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#pldBg)" stroke="#1e40af" stroke-width="4" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="#f59e0b" stroke-width="1.5" />

  <!-- Sun Rays & Sun (Simbolo Liberaldemocratico) -->
  <g transform="translate(100, 72)">
    <circle cx="0" cy="0" r="22" fill="url(#pldSun)" />
    <!-- Rays -->
    <path d="M 0 -26 L 0 -34 M 0 26 L 0 34 M -26 0 L -34 0 M 26 0 L 34 0 M -18 -18 L -24 -24 M 18 18 L 24 24 M -18 18 L -24 24 M 18 -18 L 24 -24" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- LIBERALDEMOCRATICO -->
  <text x="100" y="128" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="13" fill="#1e40af" text-anchor="middle" letter-spacing="1">
    PARTITO
  </text>
  <text x="100" y="146" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#1e40af" text-anchor="middle" letter-spacing="0.5">
    LIBERALDEMOCRATICO
  </text>

  <!-- MARATTIN pill bottom -->
  <rect x="45" y="156" width="110" height="22" rx="4" fill="#1e40af" />
  <text x="100" y="172" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11.5" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    MARATTIN
  </text>
</svg>
