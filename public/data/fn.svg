<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="fnNavy" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="tricolore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009246" />
      <stop offset="33%" stop-color="#009246" />
      <stop offset="34%" stop-color="#ffffff" />
      <stop offset="66%" stop-color="#ffffff" />
      <stop offset="67%" stop-color="#ce2b37" />
      <stop offset="100%" stop-color="#ce2b37" />
    </linearGradient>
  </defs>

  <!-- Circular Border Outer -->
  <circle cx="100" cy="100" r="98" fill="url(#fnNavy)" stroke="url(#goldRim)" stroke-width="4" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="#e2e8f0" stroke-width="1" opacity="0.4" />

  <!-- Top Arc Name -->
  <path id="textArcTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14.5" fill="#ffffff" letter-spacing="2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      FUTURO NAZIONALE
    </textPath>
  </text>

  <!-- Central Star of Italy (Stella d'Italia) -->
  <polygon points="100,52 108,74 131,74 112,88 119,110 100,97 81,110 88,88 69,74 92,74" fill="url(#goldRim)" stroke="#ffffff" stroke-width="0.8" />

  <!-- Tricolore Ribbon across center-lower -->
  <path d="M 28 118 Q 100 134 172 118 L 170 128 Q 100 144 30 128 Z" fill="url(#tricolore)" stroke="#ffffff" stroke-width="0.5" />

  <!-- Banner Bottom: VANNACCI -->
  <rect x="36" y="142" width="128" height="26" rx="4" fill="url(#goldRim)" stroke="#ffffff" stroke-width="1" />
  <text x="100" y="161" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#090d16" text-anchor="middle" letter-spacing="1.5">
    VANNACCI
  </text>
</svg>
